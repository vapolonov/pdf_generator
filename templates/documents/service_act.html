<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Акт {{act_number}}</title>
  <style>
    @page { size: A4; margin: 20mm; }
    body { font-family: Arial, "Liberation Sans", sans-serif; color: #222; line-height: 1.55; }
    h1, .date { text-align: center; }
    .parties { margin: 30px 0; }
    .service { border-left: 4px solid #4c78a8; padding: 10px 16px; background: #f4f7fa; }
    .amount { text-align: right; font-size: 14pt; font-weight: bold; }
    .signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 70px; }
  </style>
</head>
<body>
  <h1>Акт оказанных услуг</h1>
  <p class="date">№ {{act_number}} от {{date}}</p>
  <div class="parties"><p><strong>Исполнитель:</strong> {{provider}}</p><p><strong>Заказчик:</strong> {{client}}</p><p><strong>Договор:</strong> {{contract_number}}</p></div>
  <div class="service"><strong>Услуга:</strong> {{service}}<br><strong>Период:</strong> {{period}}<br><strong>Результат:</strong> {{result}}</div>
  <p class="amount">Стоимость: {{amount}} ₽</p>
  <p>{{acceptance_note}}</p>
  <div class="signatures"><div>Исполнитель<br><br>__________________</div><div>Заказчик<br><br>__________________</div></div>
</body>
</html>
