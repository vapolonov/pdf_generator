<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Накладная {{document_number}}</title>
  <style>
    @page { size: A4; margin: 18mm; }
    body { font-family: Arial, "Liberation Sans", sans-serif; color: #202124; }
    h1 { text-align: center; text-transform: uppercase; letter-spacing: 1px; }
    .parties { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 25px 0; }
    .box { border: 1px solid #555; padding: 12px; min-height: 55px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #555; padding: 8px; text-align: center; overflow-wrap: anywhere; }
    th { background: #f0f2f4; }
    .signature { margin-top: 70px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h1>Товарная накладная</h1>
  <p>Документ № {{document_number}} от {{date}}</p>
  <div class="parties"><div class="box"><strong>Отправитель</strong><br>{{sender}}</div><div class="box"><strong>Получатель</strong><br>{{recipient}}<br>{{recipient_address}}</div></div>
  <table><thead><tr><th>Товар</th><th>Ед.</th><th>Количество</th><th>Примечание</th></tr></thead>
    <tbody><tr><td>{{item}}</td><td>{{unit}}</td><td>{{quantity}}</td><td>{{note}}</td></tr></tbody>
  </table>
  <div class="signature"><span>Передал: __________________</span><span>Принял: __________________</span></div>
</body>
</html>
